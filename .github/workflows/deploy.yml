# This file was created automatically with `jupyter-book init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: Jupyter Book (via myst) GitHub Pages Deploy
on:
  push:
    branches:
      - main
      - 'ss*'
      - 'ws*'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set deployment config
        env:
          repo_name: ${{ github.event.repository.name }}
        run: |
          branch="${{ github.ref_name }}"

          if [ "$branch" = "main" ]; then
            echo "should_deploy=true" >> "$github_env"
            echo "base_url=/${repo_name}/" >> "$github_env"
            echo "deploy_target_root=true" >> "$github_env"
            exit 0
          fi

          prefix="${branch%${branch#??}}"
          number="${branch#??}"

          if ! printf '%s' "$number" | grep -eq '^[0-9]{2,}$'; then
            echo "should_deploy=false" >> "$github_env"
            exit 0
          fi

          if { [ "$prefix" = "ss" ] || [ "$prefix" = "ws" ]; } && [ "$number" -ge 26 ]; then
            echo "should_deploy=true" >> "$github_env"
            echo "base_url=/${repo_name}/${branch}/" >> "$github_env"
            echo "deploy_target_root=false" >> "$github_env"
            echo "deploy_target_folder=${branch}" >> "$github_env"
          else
            echo "should_deploy=false" >> "$github_env"
          fi

      - uses: actions/setup-node@v4
        if: env.SHOULD_DEPLOY == 'true'
        with:
          node-version: 18.x
      - name: Install Jupyter Book (via myst)
        if: env.SHOULD_DEPLOY == 'true'
        run: npm install -g jupyter-book
      - name: Build HTML Assets
        if: env.SHOULD_DEPLOY == 'true'
        run: jupyter-book build --html

      - name: Deploy main branch
        if: env.SHOULD_DEPLOY == 'true' && env.DEPLOY_TARGET_ROOT == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _build/html
          clean: true
          clean-exclude: |
            ss*
            ws*

      - name: Deploy archive branches
        if: env.SHOULD_DEPLOY == 'true' && env.DEPLOY_TARGET_ROOT != 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _build/html
          target-folder: ${{ env.DEPLOY_TARGET_FOLDER }}
          clean: true
